name: verify

# Runs on pushes to main only (and by hand), and not for changes to the
# README, LICENSE or the README's pictures.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!README*.md"
      - "!LICENSE"
      - "!docs/*.png"
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # MyGo draws the characters our faces lack with Pango on Linux, which
      # needs a font that has them: TestFallbackCharacters draws 中.
      - name: Install Pango and a CJK font
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpangocairo-1.0-0 fonts-noto-cjk
      - run: ./scripts/verify.sh
